name: 나라장터 주간 데이터 수집

on:
  schedule:
    # 매주 월요일 00:10 KST (UTC 기준 일요일 15:10)
    - cron: "10 15 * * 0"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 데이터 수집 실행
        env:
          G2B_SERVICE_KEY: ${{ secrets.G2B_SERVICE_KEY }}
        run: python scripts/collect_g2b.py

      - name: 변경사항 커밋 및 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/records.json data/meta.json
          if git diff --cached --quiet; then
            echo "변경된 데이터가 없습니다."
          else
            git commit -m "chore: 나라장터 데이터 자동 갱신 ($(date -u +%Y-%m-%d))"
            git push
          fi
